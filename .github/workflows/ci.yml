name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl unzip

      - name: Fetch LiteRT-LM runtime prebuilts
        run: |
          ./scripts/setup_deps.sh

      - name: Check code formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go tests
        run: |
          go test -v ./...

      - name: Build agent binary
        run: |
          make build

      - name: Build benchmark CLI
        run: |
          make build-bench
